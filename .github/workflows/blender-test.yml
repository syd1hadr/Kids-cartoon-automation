name: Blender Test

on:
  workflow_dispatch:

jobs:
  blender-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Blender and rendering libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            blender \
            ffmpeg \
            libegl1 \
            libgl1 \
            libglx-mesa0 \
            libx11-6 \
            libxext6 \
            libxi6 \
            libxrender1 \
            libsm6

      - name: Check Blender
        run: |
          blender --version
          ffmpeg -version

      - name: Build Milo Character
        run: |
          python tools/blender/blender_runner.py
