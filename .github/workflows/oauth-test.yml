name: YouTube OAuth Test

on:
  workflow_dispatch:

jobs:
  oauth-test:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Google Auth
        run: |
          python -m pip install --upgrade pip
          pip install google-auth requests

      - name: Test YouTube refresh token
        env:
          YOUTUBE_CREDENTIALS_B64: ${{ secrets.YOUTUBE_CREDENTIALS_B64 }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import sys

          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials

          encoded = os.environ.get("YOUTUBE_CREDENTIALS_B64", "").strip()

          if not encoded:
              raise RuntimeError("YOUTUBE_CREDENTIALS_B64 missing hai.")

          try:
              decoded = base64.b64decode(encoded).decode("utf-8")
              data = json.loads(decoded)
          except Exception as error:
              raise RuntimeError(
                  f"Base64 ya JSON invalid hai: {error}"
              ) from error

          required = [
              "client_id",
              "client_secret",
              "refresh_token",
              "token_uri",
          ]

          missing = [
              key for key in required
              if not str(data.get(key, "")).strip()
          ]

          if missing:
              raise RuntimeError(
                  f"JSON mein fields missing hain: {missing}"
              )

          client_id = str(data["client_id"]).strip()
          client_secret = str(data["client_secret"]).strip()
          refresh_token = str(data["refresh_token"]).strip()
          token_uri = str(data["token_uri"]).strip()

          print("Base64 decode: OK")
          print("JSON format: OK")
          print("Client ID ending:", client_id[-15:])
          print("Client secret present: YES")
          print("Refresh token prefix:", refresh_token[:3])
          print("Token URI:", token_uri)

          credentials = Credentials(
              token=None,
              refresh_token=refresh_token,
              token_uri=token_uri,
              client_id=client_id,
              client_secret=client_secret,
              scopes=[
                  "https://www.googleapis.com/auth/youtube.upload"
              ],
          )

          try:
              credentials.refresh(Request())
          except Exception as error:
              print("OAUTH TEST FAILED")
              print(type(error).__name__)
              print(str(error))
              sys.exit(1)

          print("OAUTH TEST SUCCESS")
          print("Google ne naya access token generate kar diya.")
          PY
