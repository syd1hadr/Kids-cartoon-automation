name: Milo Story Brain

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-story:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Story Brain
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python main.py

      - name: Upload generated story
        uses: actions/upload-artifact@v4
        with:
          name: milo-story
          path: output/*.json
          if-no-files-found: error
          retention-days: 7
