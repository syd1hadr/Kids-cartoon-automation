name: Milo Story Brain

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-story:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate story
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python main.py

      - name: Generate six Gemini image scenes
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python image_generator.py

      - name: Generate ElevenLabs voice
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python voice_generator.py
        
      - name: Upload story and images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milo-story-and-images
          path: |
            output/
          if-no-files-found: warn
          retention-days: 7
