name: Milo Nursery Rhyme Studio

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-content:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore topic history
        uses: actions/cache/restore@v4
        with:
          path: data/topic_history.json
          key: milo-topic-history-${{ github.run_id }}
          restore-keys: |
            milo-topic-history-

      - name: Show restored topic history
        run: |
          if [ -f data/topic_history.json ]; then
            echo "Previous topic history restore ho gayi."
            cat data/topic_history.json
          else
            echo "Pehla unique-topic run hai. Nayi history banegi."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg and Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg blender
          ffmpeg -version
          blender --version

      - name: Test Blender background mode
        run: |
          blender --background --python-expr "import bpy; print('BLENDER_TEST_OK', bpy.app.version_string)"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Find trending nursery rhyme topic
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          YOUTUBE_TREND_REGION: US
          YOUTUBE_TREND_LANGUAGE: en
        run: |
          python trend_finder.py

      - name: Generate unique trend-based nursery rhyme
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python main.py

      - name: Generate Short and Long reference images
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python image_generator.py

      - name: Build Milo in Blender
        run: |
          python tools/blender/blender_runner.py

      - name: Generate real Veo animated clips
        if: ${{ false }}
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          VEO_MODEL: veo-3.1-fast-generate-preview
          VEO_RESOLUTION: 720p
          VEO_MAX_WAIT_SECONDS: 1200
          VEO_MAX_RETRIES: 2
          GENERATE_LONG_MOTION: "false"
        run: |
          python motion_generator.py

      - name: Generate proper Short and Long nursery songs
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_MUSIC_MODEL_ID: music_v2
        run: |
          python song_generator.py

      - name: Generate Short and Long videos
        run: |
          python video_generator.py

      - name: Upload Short and Long automatically to YouTube
        env:
          YOUTUBE_CREDENTIALS_B64: ${{ secrets.YOUTUBE_CREDENTIALS_B64 }}
          YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS }}
        run: |
          python youtube_uploader.py

      - name: Save updated topic history
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/topic_history.json
          key: milo-topic-history-${{ github.run_id }}

      - name: Upload all generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milo-nursery-rhyme-output-${{ github.run_id }}
          path: |
            output/
            data/topic_history.json
            trend_history.json
          if-no-files-found: warn
          retention-days: 7
