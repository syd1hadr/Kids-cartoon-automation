name: Milo Nursery Rhyme Studio

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-content:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Find trending nursery rhyme topic
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          YOUTUBE_TREND_REGION: US
          YOUTUBE_TREND_LANGUAGE: en
        run: |
          python trend_finder.py

      - name: Generate trend-based nursery rhyme plan
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python main.py

      - name: Generate six Short images
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python image_generator.py

      - name: Generate Short rhyme audio
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL_ID: eleven_flash_v2_5
        run: |
          python voice_generator.py

      - name: Generate final Short video
        env:
          BACKGROUND_MUSIC_PATH: assets/music/bg_music.mp3
          VOICE_VOLUME: "1.0"
          MUSIC_VOLUME: "0.16"
        run: |
          python video_generator.py

      - name: Upload Short automatically to YouTube
        env:
          YOUTUBE_CREDENTIALS_B64: ${{ secrets.YOUTUBE_CREDENTIALS_B64 }}
          YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS }}
        run: |
          python youtube_uploader.py

      - name: Upload all generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milo-nursery-rhyme-output
          path: |
            output/
            trend_history.json
          if-no-files-found: warn
          retention-days: 7
